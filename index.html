<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papo Fantasma</title>
<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#1e1e1e;padding:24px;border-radius:16px;width:90%;max-width:380px;box-shadow:0 0 20px rgba(168,85,247,0.3)}
h1{color:#a855f7;text-align:center;margin:0 0 5px 0}
.sub{color:#888;text-align:center;font-size:13px;margin-bottom:20px}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#2a2a2a;color:#fff;box-sizing:border-box}
button{width:100%;padding:13px;margin-top:12px;border-radius:8px;border:none;background:#a855f7;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
.header{background:#1e1e1e;padding:12px;display:flex;justify-content:space-between;align-items:center}
.chat{display:none;flex-direction:column;height:100vh;width:100%;max-width:500px;margin:0 auto}
#messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 14px;border-radius:12px;max-width:80%}
.me{align-self:flex-end;background:#a855f7}
.other{align-self:flex-start;background:#2a2a2a}
.system{text-align:center;color:#666;font-size:12px;margin:8px 0}
.input-bar{padding:10px;background:#1e1e1e;display:flex;gap:8px}
.input-bar input{flex:1;margin:0}
.input-bar button{width:80px;margin:0}
</style>
</head>
<body>
<div id="login" class="card">
<h1>👻 PAPO FANTASMA</h1>
<div class="sub">Entre em um servidor secreto</div>
<input id="server" placeholder="Nome do servidor (ex: galera123)" />
<input id="pass" type="password" placeholder="Senha do servidor" />
<input id="nick" placeholder="Seu apelido fantasma" />
<button onclick="entrar()">Entrar no Papo</button>
<div style="margin-top:15px;font-size:11px;color:#666;text-align:center">Se o servidor não existir, ele será criado.<br>Se existir, precisa da senha certa.</div>
</div>
<div id="chat" class="chat">
<div class="header"><div><b id="roomName"></b> <span style="color:#888;font-size:12px" id="nickName"></span></div><div style="color:#4ade80;font-size:12px">● online</div></div>
<div id="messages"></div>
<div class="input-bar"><input id="msgInput" placeholder="Escreva anonimamente..." /><button onclick="enviar()">Enviar</button></div>
</div>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
let socket, salaAtual, apelidoAtual;
const SERVER_URL = "https://cofre-server.onrender.com";
function entrar(){
  const server = document.getElementById('server').value.trim();
  const pass = document.getElementById('pass').value.trim();
  const nick = document.getElementById('nick').value.trim();
  if(!server || !pass || !nick){ alert('Preencha Nome do servidor + Senha + Apelido!'); return; }
  salaAtual = server; apelidoAtual = nick;
  document.getElementById('login').style.display='none';
  document.getElementById('chat').style.display='flex';
  document.getElementById('roomName').innerText = 'SALA: ' + server;
  document.getElementById('nickName').innerText = '- ' + nick;
  socket = io(SERVER_URL);
  socket.on('connect', ()=>{ socket.emit('joinRoom', {room: server, password: pass, nick: nick}); addSystem('Você entrou como ' + nick); });
  socket.on('message', (data)=>{ addMsg(data.nick + ': ' + data.text, data.nick===apelidoAtual?'me':'other'); });
  socket.on('system', (text)=>{ addSystem(text); });
  socket.on('errorMsg', (text)=>{ alert(text); location.reload(); });
}
function addMsg(text, type){ const div = document.createElement('div'); div.className = 'msg ' + type; div.innerText = text; document.getElementById('messages').appendChild(div); document.getElementById('messages').scrollTop = 99999; }
function addSystem(text){ const div = document.createElement('div'); div.className = 'system'; div.innerText = text; document.getElementById('messages').appendChild(div); }
function enviar(){ const inp = document.getElementById('msgInput'); if(!inp.value.trim()) return; socket.emit('chatMessage', {text: inp.value, room: salaAtual, nick: apelidoAtual}); addMsg(apelidoAtual + ': ' + inp.value, 'me'); inp.value=''; }
document.getElementById('msgInput').addEventListener('keypress', function(e){ if(e.key==='Enter') enviar(); });
</script>
</body>
</html>
